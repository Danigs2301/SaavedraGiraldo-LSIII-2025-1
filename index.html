<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Gamer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: #f0f0f0;
        }

        header {
            background-color: #1e1e2f;
            color: #00ffcc;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 3em;
            text-shadow: 2px 2px #000;
        }

        header p {
            margin-top: 10px;
            font-style: italic;
        }

        main {
            padding: 30px 20px;
        }

        h2 {
            color: #00ffcc;
        }

        p {
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <h1>Zona Gamer</h1>
        <p>Tu portal de videojuegos, noticias y aventuras digitales</p>
    </header>
</body>
</html>
